<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Ксюши ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        .space-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.06) 0%, transparent 60%),
                #000;
            z-index: 1;
        }

        .nebula {
            position: absolute;
            top: 5%;
            left: 2%;
            width: 40vmin;
            height: 40vmin;
            max-width: 450px;
            max-height: 450px;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(200, 200, 255, 0.25) 0%, rgba(150, 150, 255, 0.1) 30%, transparent 70%);
            filter: blur(20px);
            z-index: 2;
            animation: nebulaPulse 12s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes nebulaPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .moon-wrapper {
            position: absolute;
            bottom: 8%;
            left: 5%;
            width: 18vmin;
            height: 18vmin;
            max-width: 180px;
            max-height: 180px;
            z-index: 2;
            animation: moonFloat 10s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes moonFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .moon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, #e0e0e0 0%, #a0a0a0 40%, #505050 80%, #202020 100%);
            box-shadow:
                inset -10px -10px 30px rgba(0, 0, 0, 0.8),
                inset 5px 5px 20px rgba(255, 255, 255, 0.3),
                0 0 60px rgba(255, 255, 255, 0.25);
        }

        .moon::before,
        .moon::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
        }

        .moon::before {
            top: 25%;
            left: 30%;
            width: 20%;
            height: 20%;
        }

        .moon::after {
            top: 60%;
            left: 55%;
            width: 15%;
            height: 15%;
        }

        .planet-wrapper {
            position: absolute;
            bottom: 8%;
            right: 5%;
            width: 35vmin;
            height: 35vmin;
            max-width: 380px;
            max-height: 380px;
            z-index: 2;
            animation: planetFloat 15s ease-in-out infinite;
            pointer-events: none;
            opacity: 0.9;
        }

        @keyframes planetFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
        }

        .planet {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            height: 55%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%, #c0c0c0 0%, #808080 30%, #404040 60%, #101010 100%);
            box-shadow:
                inset -30px -30px 80px rgba(0, 0, 0, 0.8),
                inset 20px 20px 60px rgba(255, 255, 255, 0.15),
                0 0 100px rgba(255, 255, 255, 0.15);
            animation: planetRotate 60s linear infinite;
        }

        @keyframes planetRotate {
            from { filter: brightness(1); }
            50% { filter: brightness(1.2); }
            to { filter: brightness(1); }
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(-20deg);
            border: 3px solid transparent;
            border-top: 4px solid rgba(255, 255, 255, 0.5);
            border-bottom: 4px solid rgba(200, 200, 200, 0.3);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        .ring-2 {
            width: 140%;
            height: 140%;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid rgba(180, 180, 180, 0.2);
        }

        .ring-3 {
            width: 100%;
            height: 100%;
            border-top: 3px solid rgba(255, 255, 255, 0.4);
            border-bottom: 3px solid rgba(200, 200, 200, 0.25);
        }

        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .bg-star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starTwinkle 3s infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .planet-wrapper {
                width: 45vmin;
                height: 45vmin;
                bottom: 5%;
                right: 5%;
            }
            .moon-wrapper {
                width: 22vmin;
                height: 22vmin;
                bottom: 6%;
                left: 5%;
            }
            .nebula {
                width: 50vmin;
                height: 50vmin;
            }
        }

        @media (max-width: 500px) {
            .planet-wrapper {
                width: 50vmin;
                height: 50vmin;
                bottom: 5%;
                right: 5%;
            }
            .moon-wrapper {
                width: 25vmin;
                height: 25vmin;
                bottom: 5%;
                left: 5%;
            }
        }
    </style>
</head>
<body>

    <div class="space-screen">
        <div class="space-bg"></div>
        <div class="nebula"></div>

        <div class="star-field" id="starField"></div>

        <div class="moon-wrapper">
            <div class="moon"></div>
        </div>

        <div class="planet-wrapper">
            <div class="ring ring-3"></div>
            <div class="ring"></div>
            <div class="ring ring-2"></div>
            <div class="planet"></div>
        </div>

        <canvas id="starCanvas"></canvas>
    </div>

    <script>
        // === ОПРЕДЕЛЯЕМ ТЕЛЕФОН ===
        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

        // === ЗВЁЗДЫ ФОНА ===
        const starField = document.getElementById('starField');
        const bgStarsCount = isMobile ? 100 : 180;
        for (let i = 0; i < bgStarsCount; i++) {
            const star = document.createElement('div');
            star.className = 'bg-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 2.5 + 0.5) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 4 + 's';
            star.style.animationDuration = (2 + Math.random() * 3) + 's';
            starField.appendChild(star);
        }

        // ============================================
        // === КВЕСТ: СЕРДЦЕ → СТРОКИ СТИХА ===
        // ============================================

        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        let particles = [];
        let animationId = null;
        let started = false;

        let imageData = null;
        let pixelBuffer = null;
        let bufW = 0;
        let bufH = 0;

        // === СТИХ (по строкам) ===
        const poemLines = [
            'Ты — как утро после сна,',
            'Как рассвет в моём окне.',
            'Ты — как тихая весна,',
            'Что пришла ко мне во сне.',
            'Твои глаза — как небеса,',
            'В них я тону без конца.',
            'Твоя улыбка — как заря,',
            'Согревает мне сердца.',
            'Ты — моя мечта, мой свет,',
            'Я тебя благодарю —',
            'За то, что ты есть на свете,',
            'За то, что я тебя люблю. ❤️'
        ];

        // Сколько секунд на сборку одной строки
        const TIME_PER_LINE = 7;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            bufW = canvas.width;
            bufH = canvas.height;
            imageData = ctx.createImageData(bufW, bufH);
            pixelBuffer = imageData.data;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // === РИСУЕМ СЕРДЦЕ С "К" ===
        function drawHeartWithK() {
            const tempCanvas = document.createElement('canvas');
            const size = 1000;
            tempCanvas.width = size;
            tempCanvas.height = size;
            const c = tempCanvas.getContext('2d');

            c.fillStyle = '#000';
            c.fillRect(0, 0, size, size);

            c.fillStyle = '#fff';
            c.beginPath();

            const cx = size / 2;
            const cy = size / 2;
            const scale = 28;

            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const px = cx + x * scale;
                const py = cy - y * scale;

                if (t === 0) c.moveTo(px, py);
                else c.lineTo(px, py);
            }
            c.closePath();
            c.fill();

            // Буква "К"
            c.fillStyle = '#000';
            c.font = 'bold ' + (size * 0.42) + 'px Arial';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText('К', cx, cy + size * 0.02);

            return tempCanvas;
        }

        // === РИСУЕМ СТРОКУ ===
        function drawLine(text) {
            const tempCanvas = document.createElement('canvas');
            const w = 1600;
            const h = 400;
            tempCanvas.width = w;
            tempCanvas.height = h;
            const c = tempCanvas.getContext('2d');

            c.fillStyle = '#000';
            c.fillRect(0, 0, w, h);

            c.fillStyle = '#fff';
            c.textAlign = 'center';
            c.textBaseline = 'middle';

            // Автоподбор размера шрифта
            let fontSize = 130;
            c.font = 'bold ' + fontSize + 'px Georgia';
            while (c.measureText(text).width > w * 0.9 && fontSize > 30) {
                fontSize -= 5;
                c.font = 'bold ' + fontSize + 'px Georgia';
            }

            c.fillText(text, w / 2, h / 2);

            return tempCanvas;
        }

        // === СОЗДАЁМ ЧАСТИЦЫ ИЗ КАРТИНКИ ===
        function createParticles(tempCanvas, widthRatio, heightRatio) {
            let imgW, imgH;

            if (tempCanvas.width === tempCanvas.height) {
                // Квадрат (сердце)
                if (isMobile) {
                    imgW = Math.min(canvas.width * 0.85, canvas.height * 0.6);
                    imgH = imgW;
                } else {
                    imgW = Math.min(canvas.width * 0.5, canvas.height * 0.7);
                    imgH = imgW;
                }
            } else {
                // Строка
                if (isMobile) {
                    imgW = canvas.width * 0.95;
                    imgH = imgW * (tempCanvas.height / tempCanvas.width);
                    if (imgH > canvas.height * 0.5) {
                        imgH = canvas.height * 0.5;
                        imgW = imgH * (tempCanvas.width / tempCanvas.height);
                    }
                } else {
                    imgW = Math.min(canvas.width * 0.9, canvas.height * 1.5);
                    imgH = imgW * (tempCanvas.height / tempCanvas.width);
                    if (imgH > canvas.height * 0.6) {
                        imgH = canvas.height * 0.6;
                        imgW = imgH * (tempCanvas.width / tempCanvas.height);
                    }
                }
            }

            const scaledCanvas = document.createElement('canvas');
            const scaledCtx = scaledCanvas.getContext('2d');

            const particleSize = isMobile ? 8 : 3;
            scaledCanvas.width = Math.floor(imgW / particleSize);
            scaledCanvas.height = Math.floor(imgH / particleSize);

            scaledCtx.drawImage(tempCanvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

            const data = scaledCtx.getImageData(0, 0, scaledCanvas.width, scaledCanvas.height).data;

            const offsetX = (canvas.width - imgW) / 2;
            const offsetY = (canvas.height - imgH) / 2;

            const newParticles = [];

            for (let y = 0; y < scaledCanvas.height; y++) {
                for (let x = 0; x < scaledCanvas.width; x++) {
                    const index = (y * scaledCanvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    if (a < 100) continue;

                    const brightness = (r + g + b) / 3;
                    if (brightness < 100) continue;

                    const targetX = offsetX + x * particleSize + particleSize / 2;
                    const targetY = offsetY + y * particleSize + particleSize / 2;

                    newParticles.push({
                        targetX: targetX,
                        targetY: targetY
                    });
                }
            }

            return newParticles;
        }

        // === ЗАПУСК ПЕРЕХОДА ===
        function transitionTo(targetParticles) {
            // Если частиц больше, чем в цели — оставляем сколько нужно
            // Если меньше — создаём новые
            const newParticles = [];

            const count = Math.min(particles.length, targetParticles.length);

            for (let i = 0; i < targetParticles.length; i++) {
                let startX, startY;

                if (i < particles.length) {
                    // Из текущей позиции
                    startX = particles[i].currentX !== undefined ? particles[i].currentX : particles[i].targetX;
                    startY = particles[i].currentY !== undefined ? particles[i].currentY : particles[i].targetY;
                } else {
                    // Новая частица — из случайного места
                    startX = Math.random() * canvas.width;
                    startY = Math.random() * canvas.height;
                }

                newParticles.push({
                    startX: startX,
                    startY: startY,
                    targetX: targetParticles[i].targetX,
                    targetY: targetParticles[i].targetY,
                    brightness: 1.0,
                    progress: 0,
                    speed: Math.random() * 0.002 + 0.002
                });
            }

            particles = newParticles;
        }

        // === ОТРИСОВКА ===
        function animate() {
            animationId = requestAnimationFrame(animate);

            pixelBuffer.fill(0);

            let allDone = true;

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                if (p.progress < 1) {
                    p.progress += p.speed;
                    if (p.progress > 1) p.progress = 1;
                    else allDone = false;
                }

                const t = p.progress;
                let ease;
                if (t < 0.5) {
                    ease = 4 * t * t * t;
                } else {
                    ease = 1 - Math.pow(-2 * t + 2, 3) / 2;
                }

                const x = p.startX + (p.targetX - p.startX) * ease;
                const y = p.startY + (p.targetY - p.startY) * ease;

                p.currentX = x;
                p.currentY = y;

                const px = Math.floor(x);
                const py = Math.floor(y);

                if (px >= 0 && px < bufW && py >= 0 && py < bufH) {
                    const idx = (py * bufW + px) * 4;
                    const bright = Math.floor(255 * p.brightness);

                    pixelBuffer[idx]     = bright;
                    pixelBuffer[idx + 1] = bright;
                    pixelBuffer[idx + 2] = bright;
                    pixelBuffer[idx + 3] = bright;
                }
            }

            ctx.putImageData(imageData, 0, 0);

            return allDone;
        }

        // === ЗАПУСК АНИМАЦИИ ===
        function startAnimation() {
            started = true;
            animate();
        }

        // === ПОКАЗ СЕРДЦА → ПОТОМ СТРОКИ ===
        function showHeart() {
            const heartCanvas = drawHeartWithK();
            const heartParticles = createParticles(heartCanvas, 1, 1);

            particles = heartParticles.map(p => ({
                startX: Math.random() * canvas.width,
                startY: Math.random() * canvas.height,
                targetX: p.targetX,
                targetY: p.targetY,
                brightness: 1.0,
                progress: 0,
                speed: Math.random() * 0.002 + 0.002
            }));

            console.log('❤️ Сердце:', particles.length, 'частиц');

            startAnimation();

            // Через 6 секунд — переход к первой строке
            setTimeout(() => {
                showLine(0);
            }, 6000);
        }

        // === ПОКАЗ СТРОКИ ===
        function showLine(index) {
            if (index >= poemLines.length) {
                // Всё закончилось — показать подпись или сердце
                console.log('✅ Все строки показаны!');
                return;
            }

            const lineCanvas = drawLine(poemLines[index]);
            const lineParticles = createParticles(lineCanvas, 1, 0.3);

            console.log('📝 Строка', index + 1, ':', poemLines[index], '—', lineParticles.length, 'частиц');

            // Переход от текущего состояния к строке
            const newParticles = [];

            for (let i = 0; i < lineParticles.length; i++) {
                let startX, startY;

                if (i < particles.length && particles[i].currentX !== undefined) {
                    startX = particles[i].currentX;
                    startY = particles[i].currentY;
                } else {
                    startX = Math.random() * canvas.width;
                    startY = Math.random() * canvas.height;
                }

                newParticles.push({
                    startX: startX,
                    startY: startY,
                    targetX: lineParticles[i].targetX,
                    targetY: lineParticles[i].targetY,
                    brightness: 1.0,
                    progress: 0,
                    speed: Math.random() * 0.003 + 0.003
                });
            }

            particles = newParticles;

            // Через TIME_PER_LINE секунд — переход к следующей строке
            setTimeout(() => {
                showLine(index + 1);
            }, TIME_PER_LINE * 1000);
        }

        // === СТАРТ ===
        window.addEventListener('load', () => {
            setTimeout(() => {
                resizeCanvas();
                showHeart();
            }, 100);
        });
    </script>
</body>
</html>

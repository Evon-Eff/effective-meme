<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Ксюши ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .space-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.06) 0%, transparent 60%),
                #000;
            z-index: 1;
        }

        .nebula {
            position: absolute;
            top: 5%;
            left: 2%;
            width: 40vmin;
            height: 40vmin;
            max-width: 450px;
            max-height: 450px;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(200, 200, 255, 0.25) 0%, rgba(150, 150, 255, 0.1) 30%, transparent 70%);
            filter: blur(20px);
            z-index: 2;
            animation: nebulaPulse 12s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes nebulaPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .moon-wrapper {
            position: absolute;
            bottom: 8%;
            left: 5%;
            width: 18vmin;
            height: 18vmin;
            max-width: 180px;
            max-height: 180px;
            z-index: 2;
            animation: moonFloat 10s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes moonFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .moon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, #e0e0e0 0%, #a0a0a0 40%, #505050 80%, #202020 100%);
            box-shadow:
                inset -10px -10px 30px rgba(0, 0, 0, 0.8),
                inset 5px 5px 20px rgba(255, 255, 255, 0.3),
                0 0 60px rgba(255, 255, 255, 0.25);
        }

        .moon::before,
        .moon::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
        }

        .moon::before {
            top: 25%;
            left: 30%;
            width: 20%;
            height: 20%;
        }

        .moon::after {
            top: 60%;
            left: 55%;
            width: 15%;
            height: 15%;
        }

        .planet-wrapper {
            position: absolute;
            bottom: 8%;
            right: 5%;
            width: 35vmin;
            height: 35vmin;
            max-width: 380px;
            max-height: 380px;
            z-index: 2;
            animation: planetFloat 15s ease-in-out infinite;
            pointer-events: none;
            opacity: 0.9;
        }

        @keyframes planetFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
        }

        .planet {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            height: 55%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%, #c0c0c0 0%, #808080 30%, #404040 60%, #101010 100%);
            box-shadow:
                inset -30px -30px 80px rgba(0, 0, 0, 0.8),
                inset 20px 20px 60px rgba(255, 255, 255, 0.15),
                0 0 100px rgba(255, 255, 255, 0.15);
            animation: planetRotate 60s linear infinite;
        }

        @keyframes planetRotate {
            from { filter: brightness(1); }
            50% { filter: brightness(1.2); }
            to { filter: brightness(1); }
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(-20deg);
            border: 3px solid transparent;
            border-top: 4px solid rgba(255, 255, 255, 0.5);
            border-bottom: 4px solid rgba(200, 200, 200, 0.3);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        .ring-2 {
            width: 140%;
            height: 140%;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid rgba(180, 180, 180, 0.2);
        }

        .ring-3 {
            width: 100%;
            height: 100%;
            border-top: 3px solid rgba(255, 255, 255, 0.4);
            border-bottom: 3px solid rgba(200, 200, 200, 0.25);
        }

        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .bg-star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starTwinkle 3s infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .planet-wrapper {
                width: 45vmin;
                height: 45vmin;
                bottom: 5%;
                right: 5%;
            }
            .moon-wrapper {
                width: 22vmin;
                height: 22vmin;
                bottom: 6%;
                left: 5%;
            }
            .nebula {
                width: 50vmin;
                height: 50vmin;
            }
        }

        @media (max-width: 500px) {
            .planet-wrapper {
                width: 50vmin;
                height: 50vmin;
                bottom: 5%;
                right: 5%;
            }
            .moon-wrapper {
                width: 25vmin;
                height: 25vmin;
                bottom: 5%;
                left: 5%;
            }
        }
    </style>
</head>
<body>

    <div class="space-screen">
        <div class="space-bg"></div>
        <div class="nebula"></div>

        <div class="star-field" id="starField"></div>

        <div class="moon-wrapper">
            <div class="moon"></div>
        </div>

        <div class="planet-wrapper">
            <div class="ring ring-3"></div>
            <div class="ring"></div>
            <div class="ring ring-2"></div>
            <div class="planet"></div>
        </div>

        <canvas id="starCanvas"></canvas>
    </div>

    <script>
        // === ОПРЕДЕЛЯЕМ ТЕЛЕФОН ===
        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

        // === ЗВЁЗДЫ ФОНА ===
        const starField = document.getElementById('starField');
        const bgStarsCount = isMobile ? 100 : 180;
        for (let i = 0; i < bgStarsCount; i++) {
            const star = document.createElement('div');
            star.className = 'bg-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 2.5 + 0.5) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 4 + 's';
            star.style.animationDuration = (2 + Math.random() * 3) + 's';
            starField.appendChild(star);
        }

        // ============================================
        // === КОМПОЗИЦИЯ ===
        // ============================================

        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        let particles = [];
        let animationId = null;
        let started = false;

        let imageData = null;
        let pixelBuffer = null;
        let bufW = 0;
        let bufH = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            bufW = canvas.width;
            bufH = canvas.height;
            imageData = ctx.createImageData(bufW, bufH);
            pixelBuffer = imageData.data;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // === СЕРДЦЕ ===
        function drawHeart(c, cx, cy, scale, lineWidth, withLetter, letter) {
            c.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const px = cx + x * scale / 16;
                const py = cy - y * scale / 16;

                if (t === 0) c.moveTo(px, py);
                else c.lineTo(px, py);
            }
            c.closePath();

            if (withLetter) {
                c.fill();
                if (letter) {
                    c.fillStyle = '#000';
                    c.font = 'bold ' + (scale * 1.2) + 'px Arial';
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.fillText(letter, cx, cy + 5);
                    c.fillStyle = '#fff';
                }
            } else {
                c.lineWidth = lineWidth;
                c.stroke();
            }
        }

        // === САТУРН ===
        function drawSaturn(c, cx, cy, r) {
            c.fillStyle = '#fff';
            c.beginPath();
            c.arc(cx, cy, r, 0, Math.PI * 2);
            c.fill();

            c.strokeStyle = '#fff';
            c.lineWidth = 3;
            c.beginPath();
            c.ellipse(cx, cy, r * 1.8, r * 0.4, -0.4, 0, Math.PI * 2);
            c.stroke();
        }

        // === ИНЬ-ЯН ===
        function drawYinYang(c, cx, cy, r) {
            c.fillStyle = '#fff';
            c.beginPath();
            c.arc(cx, cy, r, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = '#000';
            c.beginPath();
            c.arc(cx, cy, r, Math.PI / 2, Math.PI * 1.5);
            c.fill();

            c.fillStyle = '#fff';
            c.beginPath();
            c.arc(cx, cy - r / 2, r / 2, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = '#000';
            c.beginPath();
            c.arc(cx, cy + r / 2, r / 2, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = '#000';
            c.beginPath();
            c.arc(cx, cy - r / 2, r / 6, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = '#fff';
            c.beginPath();
            c.arc(cx, cy + r / 2, r / 6, 0, Math.PI * 2);
            c.fill();
        }

        // === ПЛЕЙ (два треугольника влево) ===
        function drawPlay(c, cx, cy, size) {
            c.fillStyle = '#fff';
            c.lineWidth = 4;

            c.beginPath();
            c.moveTo(cx - size * 1.8, cy - size * 0.9);
            c.lineTo(cx - size * 1.8, cy + size * 0.9);
            c.lineTo(cx - size * 0.7, cy);
            c.closePath();
            c.fill();

            c.fillRect(cx - size * 0.4, cy - size * 0.9, size * 0.25, size * 1.8);
            c.fillRect(cx + size * 0.1, cy - size * 0.9, size * 0.25, size * 1.8);

            c.beginPath();
            c.moveTo(cx + size * 1.8, cy - size * 0.9);
            c.lineTo(cx + size * 1.8, cy + size * 0.9);
            c.lineTo(cx + size * 0.7, cy);
            c.closePath();
            c.fill();
        }

        // === СЕРДЦЕ С ГЛАЗОМ ===
        function drawHeartWithEye(c, cx, cy, scale) {
            c.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const px = cx + x * scale / 16;
                const py = cy - y * scale / 16;

                if (t === 0) c.moveTo(px, py);
                else c.lineTo(px, py);
            }
            c.closePath();
            c.lineWidth = 4;
            c.stroke();

            c.fillStyle = '#fff';
            c.beginPath();
            c.ellipse(cx, cy, scale * 0.5, scale * 0.35, 0, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = '#000';
            c.beginPath();
            c.arc(cx, cy, scale * 0.18, 0, Math.PI * 2);
            c.fill();
            c.fillStyle = '#fff';
        }

        // === ПАУК ===
        function drawSpider(c, cx, cy, r) {
            c.fillStyle = '#fff';
            c.strokeStyle = '#fff';
            c.lineWidth = 3;

            c.beginPath();
            c.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
            c.fill();

            c.beginPath();
            c.arc(cx, cy - r * 0.6, r * 0.3, 0, Math.PI * 2);
            c.fill();

            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI / 4) * i + Math.PI / 8;
                const x1 = cx + Math.cos(angle) * r * 0.5;
                const y1 = cy + Math.sin(angle) * r * 0.5;
                const x2 = cx + Math.cos(angle) * r * 1.5;
                const y2 = cy + Math.sin(angle) * r * 1.5;

                c.beginPath();
                c.moveTo(x1, y1);
                c.lineTo(x2, y2);
                c.stroke();
            }
        }

        // === ВСЯ КОМПОЗИЦИЯ ===
        function drawComposition() {
            const w = 1200;
            const h = 1400;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const c = tempCanvas.getContext('2d');

            c.fillStyle = '#000';
            c.fillRect(0, 0, w, h);

            c.fillStyle = '#fff';
            c.strokeStyle = '#fff';
            c.textAlign = 'center';
            c.textBaseline = 'middle';

            // @ЛЯЛЯ
            c.font = 'bold 30px Arial';
            c.fillText('@ЛЯЛЯ', 130, 60);

            // ТЫ ПРЕКРАСНА 😍😘
            c.font = 'bold 32px Arial';
            c.fillText('ТЫ ПРЕКРАСНА', 130, 100);

            // Буква К (вместо знака Х) — большая, в центре
            c.font = 'bold 130px Arial';
            c.fillText('К', 500, 620);

            // УЛЫБНИСЬ, ТЫ КРАСОТКА
            c.font = 'bold 30px Arial';
            c.fillText('УЛЫБНИСЬ,', 180, 310);
            c.fillText('ТЫ КРАСОТКА', 180, 350);

            // Love66
            c.font = 'italic bold 45px Georgia';
            c.fillText('Love66', 700, 90);

            // Сердце с глазом
            drawHeartWithEye(c, 850, 180, 80);

            // Сердце с губами
            drawHeart(c, 600, 380, 100, 6, false, null);

            c.fillStyle = '#fff';
            c.beginPath();
            c.moveTo(565, 375);
            c.quadraticCurveTo(585, 355, 600, 370);
            c.quadraticCurveTo(615, 355, 635, 375);
            c.quadraticCurveTo(600, 385, 565, 375);
            c.closePath();
            c.fill();

            c.beginPath();
            c.moveTo(565, 375);
            c.quadraticCurveTo(600, 405, 635, 375);
            c.quadraticCurveTo(600, 385, 565, 375);
            c.closePath();
            c.fill();

            c.strokeStyle = '#000';
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(565, 375);
            c.quadraticCurveTo(600, 380, 635, 375);
            c.stroke();
            c.strokeStyle = '#fff';

            // KARMA
            c.font = 'bold 50px Arial';
            c.fillText('KARMA', 200, 480);

            // ТО... + сердце
            c.font = 'bold 20px Arial';
            c.fillText('ТО...', 450, 470);
            drawHeart(c, 520, 480, 35, 3, false, null);

            // Сатурн
            drawSaturn(c, 200, 620, 35);

            // Сердце с глазом 2
            drawHeartWithEye(c, 850, 600, 70);

            // I Love you...
            c.font = 'italic bold 32px Georgia';
            c.fillText('I', 800, 720);
            c.fillText('Love', 800, 760);
            c.fillText('you...', 800, 800);

            // Паук
            drawSpider(c, 200, 780, 30);

            // Loser
            c.font = 'bold 45px Arial';
            c.fillText('Loser', 250, 890);

            // Плей (◄◄)
            drawPlay(c, 600, 900, 25);

            // Инь-ян
            drawYinYang(c, 950, 900, 45);

            // Сердце с К (единственное, внизу)
            drawHeart(c, 700, 1080, 80, 5, true, 'К');

            // STOP angel
            c.font = 'italic bold 38px Georgia';
            c.fillText('STOP', 850, 1180);
            c.fillText('angel', 850, 1225);

            // MONSTER (вертикально)
            c.save();
            c.translate(1120, 1080);
            c.rotate(Math.PI / 2);
            c.font = 'bold 50px Arial';
            c.fillText('MONSTER', 0, 0);
            c.restore();

            // Маленькое сердце
            drawHeart(c, 950, 1080, 50, 3, false, null);

            // Шарики
            c.fillStyle = '#fff';
            c.beginPath();
            c.arc(1000, 380, 40, 0, Math.PI * 2);
            c.fill();
            c.beginPath();
            c.arc(1080, 400, 35, 0, Math.PI * 2);
            c.fill();

            c.lineWidth = 4;
            c.lineCap = 'round';
            c.beginPath();
            c.moveTo(1000, 420);
            c.lineTo(990, 440);
            c.lineTo(1010, 460);
            c.lineTo(990, 480);
            c.stroke();
            c.beginPath();
            c.moveTo(1080, 435);
            c.lineTo(1070, 460);
            c.lineTo(1090, 485);
            c.lineTo(1070, 510);
            c.stroke();

            // iloveyou
            c.font = 'bold 60px Georgia';
            c.textAlign = 'left';
            c.fillText('iloveyou', 80, 1300);

            return tempCanvas;
        }

        function initComposition() {
            const tempCanvas = drawComposition();

            let imgW, imgH;
            if (isMobile) {
                imgW = canvas.width * 0.95;
                imgH = imgW * 1.167;
                if (imgH > canvas.height * 0.85) {
                    imgH = canvas.height * 0.85;
                    imgW = imgH / 1.167;
                }
            } else {
                imgW = Math.min(canvas.width * 0.9, canvas.height * 0.77);
                imgH = imgW * 1.167;
                if (imgH > canvas.height * 0.9) {
                    imgH = canvas.height * 0.9;
                    imgW = imgH / 1.167;
                }
            }

            const scaledCanvas = document.createElement('canvas');
            const scaledCtx = scaledCanvas.getContext('2d');

            const particleSize = isMobile ? 3 : 2;
            scaledCanvas.width = Math.floor(imgW / particleSize);
            scaledCanvas.height = Math.floor(imgH / particleSize);

            scaledCtx.drawImage(tempCanvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

            const data = scaledCtx.getImageData(0, 0, scaledCanvas.width, scaledCanvas.height).data;

            const offsetX = (canvas.width - imgW) / 2;
            const offsetY = (canvas.height - imgH) / 2;

            particles = [];

            for (let y = 0; y < scaledCanvas.height; y++) {
                for (let x = 0; x < scaledCanvas.width; x++) {
                    const index = (y * scaledCanvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    if (a < 100) continue;

                    const brightness = (r + g + b) / 3;
                    if (brightness < 100) continue;

                    const targetX = offsetX + x * particleSize + particleSize / 2;
                    const targetY = offsetY + y * particleSize + particleSize / 2;

                    const startX = Math.random() * canvas.width;
                    const startY = Math.random() * canvas.height;

                    particles.push({
                        startX: startX,
                        startY: startY,
                        targetX: targetX,
                        targetY: targetY,
                        brightness: 1.0,
                        progress: 0,
                        speed: Math.random() * 0.001 + 0.001
                    });
                }
            }

            console.log('⭐ Частиц создано:', particles.length);

            if (particles.length === 0) {
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Ошибка 😔', canvas.width / 2, canvas.height / 2);
                return;
            }

            console.log('⏱️ Космос крутится 5 секунд...');
            setTimeout(() => {
                console.log('🚀 Запуск сборки!');
                started = true;
                animateComposition();
            }, 5000);
        }

        function animateComposition() {
            animationId = requestAnimationFrame(animateComposition);

            if (!started) return;

            pixelBuffer.fill(0);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                if (p.progress < 1) {
                    p.progress += p.speed;
                    if (p.progress > 1) p.progress = 1;
                }

                const t = p.progress;
                let ease;
                if (t < 0.5) {
                    ease = 4 * t * t * t;
                } else {
                    ease = 1 - Math.pow(-2 * t + 2, 3) / 2;
                }

                const x = p.startX + (p.targetX - p.startX) * ease;
                const y = p.startY + (p.targetY - p.startY) * ease;

                const px = Math.floor(x);
                const py = Math.floor(y);

                if (px >= 0 && px < bufW && py >= 0 && py < bufH) {
                    const idx = (py * bufW + px) * 4;
                    const bright = Math.floor(255 * p.brightness);

                    pixelBuffer[idx]     = bright;
                    pixelBuffer[idx + 1] = bright;
                    pixelBuffer[idx + 2] = bright;
                    pixelBuffer[idx + 3] = bright;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                resizeCanvas();
                initComposition();
            }, 100);
        });
    </script>
</body>
</html>

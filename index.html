<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ksusha1.jpg" type="image/x-icon">
    <title>Для Ксюши ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .star-portrait-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* === КОСМИЧЕСКИЙ ФОН === */
        .space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(60, 20, 120, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 40, 100, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(100, 20, 80, 0.3) 0%, transparent 60%),
                #000;
            z-index: 0;
        }

        /* === ГАЛАКТИКИ === */
        .galaxy {
            position: absolute;
            border-radius: 50%;
            filter: blur(30px);
            pointer-events: none;
            opacity: 0.6;
        }

        .galaxy-1 {
            top: 10%;
            left: 5%;
            width: 120px;
            height: 60px;
            background: radial-gradient(ellipse at center,
                rgba(180, 150, 255, 0.8) 0%,
                rgba(100, 50, 200, 0.4) 40%,
                transparent 70%);
            transform: rotate(-30deg);
            animation: galaxyPulse 10s ease-in-out infinite;
        }

        .galaxy-2 {
            top: 25%;
            right: 8%;
            width: 100px;
            height: 50px;
            background: radial-gradient(ellipse at center,
                rgba(150, 200, 255, 0.7) 0%,
                rgba(50, 100, 200, 0.3) 40%,
                transparent 70%);
            transform: rotate(45deg);
            animation: galaxyPulse 12s ease-in-out infinite;
        }

        .galaxy-3 {
            bottom: 15%;
            left: 15%;
            width: 140px;
            height: 70px;
            background: radial-gradient(ellipse at center,
                rgba(255, 200, 150, 0.6) 0%,
                rgba(200, 100, 50, 0.3) 40%,
                transparent 70%);
            transform: rotate(15deg);
            animation: galaxyPulse 14s ease-in-out infinite;
        }

        .galaxy-4 {
            bottom: 25%;
            right: 20%;
            width: 90px;
            height: 45px;
            background: radial-gradient(ellipse at center,
                rgba(200, 150, 255, 0.7) 0%,
                rgba(100, 50, 180, 0.3) 40%,
                transparent 70%);
            transform: rotate(-60deg);
            animation: galaxyPulse 11s ease-in-out infinite;
        }

        .galaxy-5 {
            top: 45%;
            left: 40%;
            width: 80px;
            height: 40px;
            background: radial-gradient(ellipse at center,
                rgba(150, 255, 220, 0.5) 0%,
                rgba(50, 150, 130, 0.25) 40%,
                transparent 70%);
            transform: rotate(80deg);
            animation: galaxyPulse 13s ease-in-out infinite;
        }

        @keyframes galaxyPulse {
            0%, 100% { opacity: 0.5; transform: rotate(var(--rot, 0deg)) scale(1); }
            50% { opacity: 0.8; transform: rotate(var(--rot, 0deg)) scale(1.15); }
        }

        /* Слабенькое затемнение по краям */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                transparent 0%,
                rgba(0, 0, 0, 0.4) 70%,
                rgba(0, 0, 0, 0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* === ЗВЁЗДЫ === */
        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .bg-star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starTwinkle 3s infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* === CANVAS ПОРТРЕТА === */
        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="star-portrait-screen">
        <!-- КОСМИЧЕСКИЙ ФОН С ГАЛАКТИКАМИ -->
        <div class="space-bg">
            <div class="galaxy galaxy-1"></div>
            <div class="galaxy galaxy-2"></div>
            <div class="galaxy galaxy-3"></div>
            <div class="galaxy galaxy-4"></div>
            <div class="galaxy galaxy-5"></div>
        </div>
        <div class="vignette"></div>

        <!-- ЗВЁЗДЫ -->
        <div class="star-field" id="starField"></div>

        <!-- ПОРТРЕТ ИЗ ЗВЁЗД -->
        <canvas id="starCanvas"></canvas>
    </div>

    <script>
        // === ОПРЕДЕЛЯЕМ ТЕЛЕФОН ===
        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

        // === ЗВЁЗДЫ ФОНА ===
        const starField = document.getElementById('starField');
        const bgStarsCount = isMobile ? 120 : 220;
        for (let i = 0; i < bgStarsCount; i++) {
            const star = document.createElement('div');
            star.className = 'bg-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 2.5 + 0.5) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 4 + 's';
            star.style.animationDuration = (2 + Math.random() * 3) + 's';
            starField.appendChild(star);
        }

        // ============================================
        // === ЗВЁЗДНЫЙ ПОРТРЕТ (Canvas 2D + ImageData) ===
        // ============================================

        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        let particles = [];
        let animationId = null;

        let imageData = null;
        let pixelBuffer = null;
        let bufW = 0;
        let bufH = 0;

        // === НАСТРОЙКИ ===
        const PARTICLE_SIZE = isMobile ? 2 : 1.2;
        const TIME_TO_TARGET = 6;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            bufW = canvas.width;
            bufH = canvas.height;
            imageData = ctx.createImageData(bufW, bufH);
            pixelBuffer = imageData.data;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // === ЗАГРУЗКА ФОТО ===
        function initStarPortrait() {
            const img = new Image();

            img.onload = function () {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');

                const brightnessMin = isMobile ? 15 : 10;
                const contrast = 1.8;

                let imgW, imgH;

                if (isMobile) {
                    imgW = canvas.width * 0.95;
                    imgH = canvas.height * 0.75;
                } else {
                    const maxSize = Math.min(canvas.width * 0.9, canvas.height * 0.9);
                    const scale = Math.min(maxSize / img.width, maxSize / img.height);
                    imgW = img.width * scale;
                    imgH = img.height * scale;
                }

                tempCanvas.width = Math.floor(imgW / PARTICLE_SIZE);
                tempCanvas.height = Math.floor(imgH / PARTICLE_SIZE);

                tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);

                const data = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;

                // Контраст
                for (let i = 0; i < data.length; i += 4) {
                    data[i]     = Math.min(255, Math.max(0, (data[i]     - 128) * contrast + 128));
                    data[i + 1] = Math.min(255, Math.max(0, (data[i + 1] - 128) * contrast + 128));
                    data[i + 2] = Math.min(255, Math.max(0, (data[i + 2] - 128) * contrast + 128));
                }

                const offsetX = (canvas.width - imgW) / 2;
                const offsetY = (canvas.height - imgH) / 2;

                particles = [];

                for (let y = 0; y < tempCanvas.height; y++) {
                    for (let x = 0; x < tempCanvas.width; x++) {
                        const index = (y * tempCanvas.width + x) * 4;
                        const r = data[index];
                        const g = data[index + 1];
                        const b = data[index + 2];
                        const a = data[index + 3];

                        if (a < 100) continue;

                        const brightness = (r + g + b) / 3;
                        if (brightness < brightnessMin) continue;

                        const targetX = offsetX + x * PARTICLE_SIZE + PARTICLE_SIZE / 2;
                        const targetY = offsetY + y * PARTICLE_SIZE + PARTICLE_SIZE / 2;

                        const startX = Math.random() * canvas.width;
                        const startY = Math.random() * canvas.height;

                        particles.push({
                            startX: startX,
                            startY: startY,
                            currentX: startX,
                            currentY: startY,
                            targetX: targetX,
                            targetY: targetY,
                            brightness: brightness / 255,
                            progress: 0,
                            speed: 1 / (TIME_TO_TARGET * 60)
                        });
                    }
                }

                console.log('⭐ Частиц создано:', particles.length);

                if (particles.length === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('Портрет не распознан 😔', canvas.width / 2, canvas.height / 2);
                    return;
                }

                animateStarPortrait();
            };

            img.onerror = function () {
                console.error('❌ Фото ksusha1.jpg не найдено');
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Фото ksusha1.jpg не найдено', canvas.width / 2, canvas.height / 2);
            };

            img.src = "ksusha1.jpg?v=" + Date.now();
        }

        // === АНИМАЦИЯ ===
        function animateStarPortrait() {
            animationId = requestAnimationFrame(animateStarPortrait);

            pixelBuffer.fill(0);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                if (p.progress < 1) {
                    p.progress += p.speed;
                    if (p.progress > 1) p.progress = 1;
                }

                const t = p.progress;
                let ease;
                if (t < 0.5) {
                    ease = 4 * t * t * t;
                } else {
                    ease = 1 - Math.pow(-2 * t + 2, 3) / 2;
                }

                p.currentX = p.startX + (p.targetX - p.startX) * ease;
                p.currentY = p.startY + (p.targetY - p.startY) * ease;

                const px = Math.floor(p.currentX);
                const py = Math.floor(p.currentY);

                if (px >= 0 && px < bufW && py >= 0 && py < bufH) {
                    const idx = (py * bufW + px) * 4;
                    // Ярче в 1.5 раза
                    const bright = Math.min(255, Math.floor(255 * p.brightness * 1.5));

                    pixelBuffer[idx]     = bright;
                    pixelBuffer[idx + 1] = bright;
                    pixelBuffer[idx + 2] = bright;
                    pixelBuffer[idx + 3] = bright;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // === СТАРТ ===
        window.addEventListener('load', () => {
            setTimeout(() => {
                resizeCanvas();
                initStarPortrait();
            }, 100);
        });
    </script>
</body>
</html>
